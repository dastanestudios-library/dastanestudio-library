<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C243E"/>
      <stop offset="100%" stop-color="#4A0E1C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD"/>
      <stop offset="50%" stop-color="#DFB26C"/>
      <stop offset="100%" stop-color="#B38035"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Shield / Rounded Crest -->
  <rect width="512" height="512" rx="128" fill="url(#burgundyGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.75"/>
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Center Literary Art (Open Book & Quill & Star) -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Book Base -->
    <path d="M256 340 C210 320 150 320 110 334 L110 180 C150 166 210 166 256 186 C302 166 362 166 402 180 L402 334 C362 320 302 320 256 340 Z" fill="#FCFBF7"/>
    
    <!-- Inner Book Pages / Lines -->
    <path d="M256 195 L256 335" stroke="#DFB26C" stroke-width="4" stroke-linecap="round"/>
    <path d="M140 220 C175 210 215 212 240 224" stroke="#8C243E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M140 250 C175 240 215 242 240 254" stroke="#8C243E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M140 280 C175 270 215 272 240 294" stroke="#8C243E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <path d="M372 220 C337 210 297 212 272 224" stroke="#8C243E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M372 250 C337 240 297 242 272 254" stroke="#8C243E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M372 280 C337 270 297 272 272 294" stroke="#8C243E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Royal Monogram "DS" -->
    <text x="256" y="140" font-family="'Cinzel', 'Playfair Display', serif" font-size="44" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">DASTANE</text>

    <!-- Star / Luminary icon -->
    <polygon points="256,70 262,86 278,88 266,100 270,116 256,107 242,116 246,100 234,88 250,86" fill="url(#goldGrad)"/>
  </g>
</svg>
